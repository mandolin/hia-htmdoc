name: npm Bootstrap Publish

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact pushed main commit approved for the bootstrap"
        required: true
        type: string
      confirm_bootstrap:
        description: "Type: bootstrap 8 @hia-doc htmdoc packages"
        required: true
        type: string
      resume_partial_batch:
        description: "Resume only after independently verifying a partial registry batch"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-htmdoc-bootstrap-0.1.0
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap eight HTMDoc packages with provenance
    if: inputs.confirm_bootstrap == 'bootstrap 8 @hia-doc htmdoc packages'
    runs-on: ubuntu-latest

    steps:
      - name: Check out approved repository state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify exact approved commit
        shell: bash
        run: |
          test "$GITHUB_SHA" = "${{ inputs.expected_head_sha }}"
          test "$GITHUB_REF_NAME" = "main"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm publication baseline
        run: npm install --global npm@11.18.0

      - name: Verify dedicated bootstrap credential exists
        env:
          HIA_NPM_BOOTSTRAP_TOKEN: ${{ secrets.HIA_NPM_BOOTSTRAP_TOKEN }}
        run: test -n "$HIA_NPM_BOOTSTRAP_TOKEN"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run publish-ready release gate
        run: npm run release:gate

      - name: Bootstrap approved package batch
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HIA_NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/bootstrap-public-release.cjs --publish ${{ inputs.resume_partial_batch && '--resume' || '' }}

      - name: Run clean registry consumer and provenance verification
        run: npm run release:registry:check
