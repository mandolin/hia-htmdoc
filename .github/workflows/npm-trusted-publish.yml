name: npm Trusted Publish

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Candidate package name, for example @hia-doc/htmdoc-spec"
        required: true
        type: string
      confirm_publish:
        description: "Type: publish @hia-doc htmdoc package"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish one approved package with npm provenance
    if: inputs.confirm_publish == 'publish @hia-doc htmdoc package'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm trusted publishing baseline
        run: npm install --global npm@11.18.0

      - name: Refuse candidates without explicit publish approval
        id: resolve
        run: node scripts/resolve-release-package.cjs "${{ inputs.package_name }}" --publish-ready --github-output

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run release gate
        run: npm run release:gate

      - name: Pack approved package
        run: |
          mkdir -p "$RUNNER_TEMP/hia-pack"
          npm pack --workspace "${{ steps.resolve.outputs.package_name }}" --pack-destination "$RUNNER_TEMP/hia-pack"
          ls -la "$RUNNER_TEMP/hia-pack"

      - name: Publish package tarball
        run: npm publish "$RUNNER_TEMP"/hia-pack/*.tgz --access public --provenance --registry=https://registry.npmjs.org/
