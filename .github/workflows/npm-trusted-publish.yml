name: npm Trusted Publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select which release path to run
        type: choice
        required: true
        default: stable
        options:
          - stable
          - candidate-audit
          - candidate-publish
      package_name:
        description: "Candidate package name, for example @hia-doc/htmdoc-spec"
        required: false
        type: string
      confirm_publish:
        description: "Type: publish @hia-doc htmdoc package"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish one approved package with npm provenance
    if: inputs.operation == 'stable' && inputs.package_name != '' && inputs.confirm_publish == 'publish @hia-doc htmdoc package'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm trusted publishing baseline
        run: npm install --global npm@11.18.0

      - name: Refuse candidates without explicit publish approval
        id: resolve
        env:
          FORMAL_PACKAGE: ${{ inputs.package_name }}
        run: node scripts/resolve-release-package.cjs "$FORMAL_PACKAGE" --publish-ready --github-output

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run release gate
        run: npm run release:gate

      - name: Pack approved package
        run: |
          mkdir -p "$RUNNER_TEMP/hia-pack"
          npm pack --workspace "${{ steps.resolve.outputs.package_name }}" --pack-destination "$RUNNER_TEMP/hia-pack"
          ls -la "$RUNNER_TEMP/hia-pack"

      - name: Publish package tarball
        run: npm publish "$RUNNER_TEMP"/hia-pack/*.tgz --access public --provenance --registry=https://registry.npmjs.org/

  candidate:
    # <lang lang="zh-CN">只使用全局已核对的归档和审批入口。</lang><lang lang="en">Use the coordinated verified archive and approval path.</lang>
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'candidate-audit' || inputs.operation == 'candidate-publish')
    uses: mandolin/HIA-Documentation/.github/workflows/publish-npm-candidate.yml@bc2b83b76ba40bd599892f83e629ed5b73fc7200
    with:
      release_revision: bc2b83b76ba40bd599892f83e629ed5b73fc7200
      mode: ${{ inputs.operation == 'candidate-audit' && 'audit' || 'publish' }}
      package_name: ${{ inputs.package_name }}
      confirmation: ${{ inputs.confirm_publish }}
    secrets:
      bootstrap_token: ${{ secrets.HIA_NPM_BOOTSTRAP_TOKEN }}
